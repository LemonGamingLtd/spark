plugins {
    id 'maven-publish'
}

dependencies {
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

license {
    rule(project.file('HEADER.txt'))
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    repositories {
        maven {
            name = 'lgNexus'
            url = project.version.toString().endsWith('SNAPSHOT')
                    ? "https://repo.lemongaming.ltd/repository/maven-snapshots/"
                    : "https://repo.lemongaming.ltd/repository/maven-releases/"
            credentials {
                username = findProperty("lgNexusUser") ?: ""
                password = findProperty("lgNexusPass") ?: ""
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'ltd.lemongaming.spark'
            artifactId = 'spark-api'
            version = project.version
            pom {
                name = 'spark'
                description = 'spark is a performance profiling plugin/mod for Minecraft clients, servers and proxies.'
                url = 'https://spark.lucko.me/'
            }
        }
    }
}
